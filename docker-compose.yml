services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: vault-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
    command: ["--smtp-auth-allow-insecure"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8025 -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.32.0
    container_name: vault-azurite
    ports:
      - "10000:10000"  # Blob service
      # - "10001:10001"  # Queue service
      # - "10002:10002"  # Table service
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - AZURITE_LOCATOR=127.0.0.1
    volumes:
      - azurite_data:/data
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:10000/devstoreaccount1?comp=list -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real Azure Cosmos DB Linux emulator (vNext). Unlike Cosmium it enforces
  # partition-key semantics, so it validates the hierarchical partition key
  # [/ownerId, /parentId, /id] used by the entries container (ADR 0028 §3.1).
  # Uses the well-known emulator key (hardcoded in apps/server/src/db.ts) and a
  # self-signed cert; the server disables TLS verification for localhost.
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: vault-cosmos
    ports:
      - "8081:8081"   # Gateway
      - "1234:1234"   # Data Explorer
    environment:
      PROTOCOL: https
    volumes:
      - cosmos_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8081/ -o /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: vault-rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  azurite_data:
  cosmos_data:
  rustfs_data:
