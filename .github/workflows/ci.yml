name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start services
        run: docker compose up -d azurite cosmos rustfs

      - name: Wait for Azurite
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:10000/devstoreaccount1?comp=list -o /dev/null; then
              echo "Azurite ready"
              exit 0
            fi
            sleep 2
          done
          echo "Azurite failed to start"
          docker logs vault-azurite
          exit 1

      - name: Wait for Cosmos DB
        run: |
          for i in {1..90}; do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' vault-cosmos 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then
              echo "Cosmos DB ready"
              exit 0
            fi
            sleep 3
          done
          echo "Cosmos DB failed to start"
          docker logs vault-cosmos
          exit 1

      - name: Wait for RustFS
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/health -o /dev/null 2>/dev/null; then
              echo "RustFS ready"
              exit 0
            fi
            sleep 2
          done
          echo "RustFS failed to start"
          docker logs vault-rustfs
          exit 1

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
