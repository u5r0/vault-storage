name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Azurite
        run: docker compose up -d azurite

      - name: Wait for Azurite
        run: |
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' vault-azurite 2>/dev/null | grep -q healthy; then
              echo "Azurite is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Azurite failed to become healthy"
          docker logs vault-azurite
          exit 1

#      - name: Run unit tests
#        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
