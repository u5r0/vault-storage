name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start services
        run: docker compose up -d azurite cosmos

      - name: Wait for Azurite
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:10000/devstoreaccount1?comp=list -o /dev/null; then
              echo "Azurite ready"
              exit 0
            fi
            sleep 2
          done
          echo "Azurite failed to start"
          docker logs vault-azurite
          exit 1

      - name: Wait for Cosmos DB
        run: |
          for i in {1..90}; do
            if curl -fsk https://localhost:8081/_explorer/emulator.pem -o /dev/null; then
              echo "Cosmos DB ready"
              exit 0
            fi
            sleep 3
          done
          echo "Cosmos DB failed to start"
          docker logs vault-cosmos
          exit 1

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
