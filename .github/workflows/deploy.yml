name: Deploy

# Continuous deployment: runs after CI succeeds on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_terraform:
        description: "Run terraform apply (infrastructure changes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  terraform:
    if: github.event.inputs.run_terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.tf-output.outputs.api_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform Apply
        run: |
          cd infra
          terraform init
          terraform apply -var-file=envs/prod.tfvars -auto-approve \
            -var="ghcr_token=${{ secrets.ghcr_token }}" \
            -var="cloudflare_api_token=${{ secrets.cloudflare_api_token }}"

      - name: Get Terraform Output
        id: tf-output
        run: |
          cd infra
          API_URL=$(terraform output -json | jq -r '.api_url.value')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-api:
    needs: [terraform]
    if: always() && needs.terraform.result != 'failure' && (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/vault-api"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          docker build -f apps/server/Dockerfile -t "$IMAGE:$SHA" .
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 1. Authenticate with Infisical using GitHub's OIDC & Export Secrets
      - name: Authenticate and Fetch Infisical Secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: "${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}"
          project-slug: "vault-storage-yo-ie"
          env-slug: "prod"
          export-type: env

      - name: Deploy to Container App
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          az containerapp update \
            --name vault-api \
            --resource-group vault-prod-rg \
            --image "ghcr.io/$OWNER/vault-api:${{ github.event.workflow_run.head_sha || github.sha }}" \
            --set-env-vars \
              JWT_SECRET="$JWT_SECRET" \
              AUTH_SECRET="$AUTH_SECRET" \
              RESEND_API_KEY="$RESEND_API_KEY" \
              R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
              R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
              
  deploy-web:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @vault/sdk build
      - name: Build SPA
        run: pnpm --filter @vault/web build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve API FQDN
        run: |
          FQDN=$(az containerapp show \
            --name vault-api \
            --resource-group vault-prod-rg \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          if [ -z "$FQDN" ] || [ "$FQDN" = "None" ]; then
            echo "::error::vault-api ingress FQDN is empty; cannot configure worker proxy"
            exit 1
          fi
          echo "VITE_API_URL=https://${FQDN}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config apps/web/wrangler.toml --var VITE_API_URL:"${VITE_API_URL}"