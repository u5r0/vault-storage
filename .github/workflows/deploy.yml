name: Deploy

# Continuous deployment: runs after CI succeeds on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_terraform:
        description: "Run terraform apply (infrastructure changes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write
  actions: write

jobs:
  terraform:
    if: github.event.inputs.run_terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api_url: ${{ steps.tf-output.outputs.api_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform Apply
        run: |
          cd infra
          terraform init
          terraform apply -var-file=envs/prod.tfvars -auto-approve \
            -var="ghcr_token=${{ secrets.ghcr_token }}" \
            -var="jwt_secret=${{ secrets.jwt_secret }}" \
            -var="auth_secret=${{ secrets.auth_secret }}" \
            -var="r2_access_key_id=${{ secrets.r2_access_key_id }}" \
            -var="r2_secret_access_key=${{ secrets.r2_secret_access_key }}" \
            -var="cloudflare_api_token=${{ secrets.cloudflare_api_token }}" \
            -var="smtp_user=${{ secrets.smtp_user }}" \
            -var="smtp_pass=${{ secrets.smtp_pass }}" \
            -var="smtp_host=${{ vars.smtp_host }}" \
            -var="smtp_port=${{ vars.smtp_port }}" \
            -var="smtp_secure=${{ vars.smtp_secure }}"

      - name: Get Terraform Output
        id: tf-output
        run: |
          cd infra
          API_URL=$(terraform output -json | jq -r '.api_url.value')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-api:
    needs: [terraform]
    if: always() && (github.event.workflow_run.conclusion == 'success' || github.event.type == 'workflow_dispatch') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/vault-api"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          docker build -f apps/server/Dockerfile -t "$IMAGE:$SHA" .
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          az containerapp update \
            --name vault-api \
            --resource-group vault-prod-rg \
            --image "ghcr.io/$OWNER/vault-api:${{ github.event.workflow_run.head_sha || github.sha }}"

  deploy-web:
    needs: [terraform]
    if: always() && (github.event.workflow_run.conclusion == 'success' || github.event.type == 'workflow_dispatch') && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm --filter @vault/web build
        env:
          VITE_API_URL: ${{ needs.terraform.outputs.api_url || vars.VITE_API_URL }}

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_URL: ${{ needs.terraform.outputs.api_url || vars.VITE_API_URL }}
        run: npx wrangler@4 deploy --config apps/web/wrangler.toml --var VITE_API_URL="${VITE_API_URL}"