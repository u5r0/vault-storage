name: Deploy

# Continuous deployment: runs after CI succeeds on main.
# Two independent jobs fan out from one CI-success event:
#   deploy-api  → build image → push to ghcr.io → update Azure Container App
#   deploy-web  → build SPA   → deploy to Cloudflare Pages (production)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_terraform:
        description: "Run terraform apply (infrastructure changes)"
        required: false
        default: false
        type: boolean

# Supersede an in-flight deploy when a newer commit lands.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  terraform:
    if: github.event.inputs.run_terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform Apply
        run: |
          cd infra
          terraform init
          terraform apply -var-file=envs/prod.tfvars -auto-approve \
            -var="ghcr_token=${{ secrets.ghcr_token }}" \
            -var="r2_access_key_id=${{ secrets.r2_access_key_id }}" \
            -var="r2_secret_access_key=${{ secrets.r2_secret_access_key }}" \
            -var="jwt_secret=${{ secrets.jwt_secret }}" \
            -var="auth_secret=${{ secrets.auth_secret }}" \
            -var="smtp_user=${{ secrets.smtp_user }}" \
            -var="smtp_pass=${{ secrets.smtp_pass }}" \
            -var="cloudflare_api_token=${{ secrets.cloudflare_api_token }}"
      - name: Set GitHub Variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each run-step resets to repo root, so the `cd infra` in the apply
          # step above does not persist. terraform output must run in infra/.
          cd infra
          API_URL=$(terraform output -raw api_url)
          gh variable set VITE_API_URL -b "$API_URL"

  deploy-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Pin to the exact commit that triggered the upstream CI run.
          # Without this, workflow_run uses the default-branch tip, which
          # can differ from the CI commit on fast-push branches.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          # ghcr.io rejects uppercase letters in image names — downcase the
          # owner (handles GitHub orgs/users that contain uppercase chars).
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/vault-api"
          # Use the CI commit SHA, not github.sha (which is the workflow file
          # SHA under workflow_run — they can diverge).
          SHA="${{ github.event.workflow_run.head_sha }}"

          docker build -f apps/server/Dockerfile -t "$IMAGE:$SHA" .
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        run: |
          # Container App name and resource group must match infra/main.tf
          # (azurerm_container_app.api.name = "vault-api",
          #  azurerm_resource_group.main.name = "vault-prod-rg").
          # If those are renamed in Terraform, update here too.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          az containerapp update \
            --name vault-api \
            --resource-group vault-prod-rg \
            --image "ghcr.io/$OWNER/vault-api:${{ github.event.workflow_run.head_sha }}"

  deploy-web:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm --filter @vault/web build
        env:
          # Public API URL baked into the bundle at build time.
          # Set as a repository variable (Settings → Variables → Actions).
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Pages project must already exist (provisioned once — see infra).
          command: pages deploy apps/web/dist --project-name=vault-storage --branch=main
